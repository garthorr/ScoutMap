services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scoutmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: scoutmap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoutmap"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.scoutmap.rule=Host(`scoutmap.oracle.tastymath.com`)"
      - "traefik.http.routers.scoutmap.entrypoints=websecure"
      - "traefik.http.routers.scoutmap.tls=true"
      - "traefik.http.services.scoutmap.loadbalancer.server.port=8000"
    environment:
      DATABASE_URL: postgresql://scoutmap:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/scoutmap
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-scoutmap@localhost}
      # The container entrypoint runs migrations before uvicorn starts,
      # so the app workers must not race to run them again.
      AUTO_MIGRATE: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sample_data:/app/sample_data
    networks:
      - internal
      - traefik

networks:
  internal:
  traefik:
    external: true
    name: traefik

volumes:
  pgdata:
