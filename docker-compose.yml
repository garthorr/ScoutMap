services:
  traefik:
    image: traefik:v3.1
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - traefik

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scoutmap
      POSTGRES_PASSWORD: scoutmap
      POSTGRES_DB: scoutmap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoutmap"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - traefik

  app:
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.scoutmap.rule=Host(`scoutmap.oracle.tastymath.com`)"
      - "traefik.http.routers.scoutmap.entrypoints=websecure"
      - "traefik.http.routers.scoutmap.tls=true"
      - "traefik.http.services.scoutmap.loadbalancer.server.port=8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://scoutmap:scoutmap@db:5432/scoutmap
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sample_data:/app/sample_data
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: traefik

volumes:
  pgdata:
