services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scoutmap
      POSTGRES_PASSWORD: scoutmap
      POSTGRES_DB: scoutmap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoutmap"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.scoutmap.rule=Host(`scoutmap.oracle.tastymath.com`)"
      - "traefik.http.routers.scoutmap.entrypoints=websecure"
      - "traefik.http.routers.scoutmap.tls=true"
      - "traefik.http.routers.scoutmap.tls.certresolver=letsencrypt"
      - "traefik.http.services.scoutmap.loadbalancer.server.port=8000"
      - "traefik.http.routers.scoutmap-http.rule=Host(`scoutmap.oracle.tastymath.com`)"
      - "traefik.http.routers.scoutmap-http.entrypoints=web"
      - "traefik.http.routers.scoutmap-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
    environment:
      DATABASE_URL: postgresql://scoutmap:scoutmap@db:5432/scoutmap
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sample_data:/app/sample_data
    networks:
      - internal
      - traefik

networks:
  internal:
  traefik:
    external: true
    name: traefik

volumes:
  pgdata:
